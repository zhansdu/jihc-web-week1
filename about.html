<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="imgs/knight.png">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/SplitText.min.js"></script>
    <title>Chess</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 0;
            margin: 0;
            background-image: 
                linear-gradient(45deg, #ffffff 25%, transparent 25%),
                linear-gradient(-45deg, #ffffff 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ffffff 75%),
                linear-gradient(-45deg, transparent 75%, #ffffff 75%)
            ;
            background-size: 142.5px 142px;
            background-position: 0 0, 0 71px, 71px -71px, -71px 0px;
            background-color: rgb(235, 226, 235, 0.5);
        }

        .navbar {
            position: fixed;
            width: 100%;
            box-sizing: border-box;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgb(0, 0, 0, 0.05);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .navbar-aside {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .sign-btn {
            font-size: 16px;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: radial-gradient(#d0a4d0, #f0c0f0);
            cursor: pointer;
            transition: 0.3s ease;
        }

        .sign-btn:hover {
            transform: scale(1.05);
        }

        .navbar-aside button:not(.sign-btn) {
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: transparent;
            padding: 8px 4px;
            position: relative;
        }

        .navbar-aside button:not(.sign-btn) {
            transition: transform 0.3s ease;
        }

        @keyframes underline-slide {
            from { transform: scaleX(0); }
            to   { transform: scaleX(1); }
        }

        .navbar-aside button:not(.sign-btn)::before {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 2px;
            background: black;
            transform: scaleX(0);
            transform-origin: left;
        }

        .navbar-aside button:not(.sign-btn):hover::before {
            animation: underline-slide 0.3s ease forwards;
        }

        .navbar-aside button:not(.sign-btn).active::before {
            transform: scaleX(1);
        }

        .home-img {
            width: 40px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .home-img:hover {
            transform: scale(1.05) skewX(3deg);
        }

        .hidden {
            display: none;
        }

        .img-avatar {
            width: 25px;
            border: 2px solid black;
            border-radius: 50%;
            padding: 10px;
        }

        main {
            min-height: 85vh;
            padding: 0px 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            font-size: 50px;
        }
    </style>
</head>
<body>
    <section class="navbar">
        <a href="index.html"><img src="imgs/knight.png" class="home-img"></a>
        <aside class="navbar-aside">
            <a href="index.html"><button class="home-btn">Home</button></a>
            <a href="table.html"><button class="users-btn">Users</button></a>
            <a href="about.html"><button class="about-btn active">About</button></a>
            <a href="signup.html"><button class="sign-btn">Sign up</button></a>
            <img src="imgs/icons8-pawn-50.png" class="img-avatar hidden" id="img-avatar">
        </aside>
    </section>
    <main>
        <h1>We're building a website about chess for people who want to understand the game, not just know the rules.</h1>
    </main>
    <script>
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';

        if (isLoggedIn) {
            document.querySelector('.sign-btn').classList.add('hidden');
            document.getElementById('img-avatar').classList.remove('hidden');
        }

        gsap.registerPlugin(SplitText)
        const split = new SplitText('h1', {type: 'words'})

        gsap.from(split.words, {
            y: 10,
            opacity: 0,
            duration: 0.8,
            stagger: 0.06,
            ease: 'power3.out'
        });
    </script>
</body>
</html>
