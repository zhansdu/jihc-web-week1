<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="container">
            <a class="nav-box" href="home.html">Go Homepage</a>
            <div class="nav-links">
                <a href="home.html" class="btn">Home</a>
                <a href="register.html" class="btn">Registration</a>
                <a href="users.html" class="btn">Users</a>
                <a href="empty.html" class="btn">Empty</a>
                <button id="modalBtn" class="btn login-button" type="button">Login</button>
            </div>
        </div>
    </nav>
    <main class="registration">
        <h2>Registration</h2>
        <form id="form">
            <input type="text" id="name" required placeholder="Enter name">
            <input type="email" id="email" required aria-label="Email" placeholder="Enter email">
            <input type="password" id="password" required aria-label="Password" placeholder="Enter password">
            <button type="submit" class="btn white">Submit</button>
        </form>
    </main>
    <footer>
        <p>JIHC © 2026</p>
    </footer>
    <div id="loginModal" class="popup">
        <div class="modal">
            <h2 id="loginTitle">Login</h2>
            <form id="loginForm">
                <label for="loginEmail">Email</label>
                <input id="loginEmail" name="email" type="email" placeholder="Email" autocomplete="username" required>
                <label for="loginPassword">Password</label>
                <input id="loginPassword" name="password" type="password" placeholder="Password" required>
                <button class="btn white" type="submit">Submit</button>
                <button id="loginCloseBtn" class="btn white">Close</button>
            </form>
        </div>
    </div>
    <div id="Modal" class="popup" >
        <div class="modal">
            <p id="ModalText"></p>
            <button id="ModalCloseBtn" class="btn white" >Close</button>
        </div>
    </div>
    <script src="login.js"></script>
    <script >let form = document.getElementById("form");

form.addEventListener("submit", function (event) {
    event.preventDefault();

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim().toLowerCase();
    let password = document.getElementById("password").value;
    let userList = loadUsers();

    if (name === "" || email === "" || password.trim() === "") {
        return showAlert("Please complete all fields.");
    }

    let exists = userList.some(function (user) {
        return user.email.trim().toLowerCase() === email;
    });

    if (exists) {
        return showAlert("This email is already registered.");
    }

    userList.push({
        name: name,
        email: email,
        password: password
    });

    saveUsers(userList);
    form.reset();

    return showModal("Registration completed successfully.");
});</script>
</body>

</html>
