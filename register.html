<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="container">
            <a class="nav-box" href="home.html">Go Homepage</a>
            <div class="nav-links">
                <a href="home.html" class="btn">Home</a>
                <a href="register.html" class="btn">Registration</a>
                <a href="users.html" class="btn">Users</a>
                <a href="empty.html" class="btn">Empty</a>
            </div>
        </div>
    </nav>
    <main>
        <h2>Registration</h2>
        <form id="form">
            <input type="text" id="name" required aria-label="Name" placeholder="Enter name">
            <input type="email" id="email" required aria-label="Email" placeholder="Enter email">
            <input type="password" id="password" required aria-label="Password" placeholder="Enter password">
            <button type="submit" class="btn white">Submit</button>
        </form>
    </main>
    <footer>
        <p>JIHC © 2026</p>
    </footer>
    <dialog id="messageModal" class="modal" aria-labelledby="message">
        <p id="message"></p>
        <button id="closeBtn" class="btn" type="button">Close</button>
    </dialog>
    <script>
        function loadUsers() {
            let users = JSON.parse(localStorage.getItem("users") || "[]");
            if (!Array.isArray(users)) {
                throw new Error("Invalid users list");
            }
            for (let user of users) {
                if (!user || typeof user.name !== "string" || typeof user.email !== "string") {
                    throw new Error("Invalid user");
                }
            }
            return users;
        }

        let form = document.getElementById("form");
        let modal = document.getElementById("messageModal");

        function showMessage(message) {
            document.getElementById("message").textContent = message;
            modal.showModal();
        }

        document.getElementById("closeBtn").onclick = function () {
            modal.close();
        };

        form.onsubmit = function (event) {
            event.preventDefault();
            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim().toLowerCase();
            let password = document.getElementById("password").value;

            if (!name || !email || !password.trim()) {
                showMessage("Please complete all fields.");
                return;
            }

            try {
                let users = loadUsers();
                for (let user of users) {
                    if (user.email.trim().toLowerCase() === email) {
                        showMessage("This email is already registered.");
                        return;
                    }
                }
                users.push({ name: name, email: email, password: password });
                localStorage.setItem("users", JSON.stringify(users));
            } catch (error) {
                showMessage("Cannot read or save users. Check browser storage.");
                return;
            }

            form.reset();
            showMessage("Registration completed successfully.");
        };
    </script>
</body>

</html>
