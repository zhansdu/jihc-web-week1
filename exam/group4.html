<html>
  <head>
    <title>Quiz</title>
    <style>
      .formWrapper{
        display: flex;
        gap: 4px;
      }
      .submit{
        border-radius: 4px;
        border: 0;
        background-color: orange;
        padding:0 20px;
      }

      #nameText{
        border:1px solid orange;
        border-radius: 4px;
        width:200px;
        padding:5px
      }

      #options{
        display: flex;
        gap: 3px;
        flex-wrap: wrap;
        margin: 10px 0;
      }

      #options > div{
        border-radius: 15px;
        border: 2px solid black;
        width:fit-content;
        padding: 5px 10px;
        cursor: pointer;
      }
      #options > div:hover{
        background-color: orange;
        border-color: transparent;
        color:white;
      }

      .active{
        background-color: orange;
        border-color: transparent;
        color:white;
      }

      #result{
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div>What is the capital of Kazakhstan?</div>
    <div id="options">
      <div>Almaty</div>
      <div class="correct">Astana</div>
      <div>Shymkent</div>
      <div>Taraz</div>
    </div>

    <form id="formWrapper" class="formWrapper">
      <input type="text" id="nameText" placeholder="Your name">
      <button class="submit">Submit</button>
    </form>

    <div id="result"></div>

    <script>
      const formWrapper = document.getElementById('formWrapper')
      const nameText = document.getElementById('nameText')
      const options = document.querySelectorAll('#options > div')
      const result = document.getElementById('result')

      let selected = null

      options.forEach(o=>{
        o.addEventListener('click',()=>{
          options.forEach(x=>x.classList.remove('active'))

          o.classList.add('active')
          selected = o
        })
      })

      formWrapper.addEventListener('submit',(e)=>{
        e.preventDefault()
        if(nameText.value){
          if(selected && selected.classList.contains('correct')){
            result.innerHTML = 'Correct, '+nameText.value+'!'
          }else{
            result.innerHTML = 'Incorrect, '+nameText.value
          }
        }
      })
    </script>
  </body>
</html>
