<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelers | Travel Agency</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="head">
            <h1>Beautiful places around the world</h1>
            <div class="right-head">
                <p><a href="index.html">Home</a></p>
                <p><a href="about.html">About</a></p>
                <p><a href="destinations.html">Destinations</a></p>
                <p><a href="gallery.html" class="active">Travelers</a></p>
                <p><a href="#" id="openLoginBtn" class="btn-login">Login</a></p>
            </div>
        </div>
    </header>

    <main class="container">
        <h1 class="section-title">Registered Travelers</h1>
        <div class="table-wrap">
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Preferred Destination</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
            </table>
        </div>
    </main>

    <div id="authModal" class="modal">
        <div class="modal-box">
            <span id="closeModalBtn" class="close-modal">&times;</span>

            <div class="auth-tabs-nav">
                <button type="button" id="tabLoginBtn" class="auth-tab-btn active">Login</button>
                <button type="button" id="tabRegisterBtn" class="auth-tab-btn">Register</button>
            </div>

            <form id="loginForm" class="auth-form">
                <input type="text" id="loginEmail" placeholder="Email or Username" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit" class="btn-submit">Log In</button>
            </form>

            <form id="registerForm" class="auth-form" style="display: none;">
                <input type="text" id="regName" placeholder="Full Name" required>
                <input type="email" id="regEmail" placeholder="Email Address" required>
                <input type="text" id="regDestination" placeholder="Dream Destination" required>
                <input type="password" id="regPassword" placeholder="Create Password" required>
                <button type="submit" id="regSubmitBtn" class="btn-submit">Create Account</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Travel Agency. All rights reserved.</p>
        <p>Beautiful Places Around The World</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
