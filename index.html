<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание: SPA Сайт с Auth & LocalStorage</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col min-h-screen bg-slate-100 text-slate-800 font-sans">

  <nav class="sticky top-0 z-40 bg-indigo-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="font-bold text-xl tracking-wide">DevProject</div>
      
      <div class="flex space-x-1 md:space-x-4 text-sm font-medium">
        <button data-page="home" class="nav-btn px-3 py-2 rounded-lg hover:bg-indigo-700 transition">Главная</button>
        <button data-page="users" class="nav-btn px-3 py-2 rounded-lg hover:bg-indigo-700 transition">Пользователи</button>
        <button data-page="about" class="nav-btn px-3 py-2 rounded-lg hover:bg-indigo-700 transition">О нас</button>
        <button data-page="empty" class="nav-btn px-3 py-2 rounded-lg hover:bg-indigo-700 transition">Пустая</button>
      </div>

      <button id="open-modal-btn" class="bg-white text-indigo-600 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-50 transition shadow-sm">
        Войти
      </button>
    </div>
  </nav>

  <main class="flex-grow max-w-6xl w-full mx-auto p-6">
    
    <section id="page-home" class="page-content space-y-6">
      <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
        <h1 class="text-3xl font-extrabold text-slate-900 mb-3">Добро пожаловать в проект!</h1>
        <p class="text-slate-600 leading-relaxed max-w-2xl">
          Это демо проекта.
        </p>
      </div>
    </section>

    <section id="page-users" class="page-content hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-slate-900">Зарегистрированные пользователи</h2>
        <span class="text-xs bg-indigo-100 text-indigo-700 font-semibold px-2.5 py-1 rounded-full">localStorage</span>
      </div>
      
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold uppercase text-slate-500 tracking-wider">
              <th class="p-4">#</th>
              <th class="p-4">Имя</th>
              <th class="p-4">Email</th>
            </tr>
          </thead>
          <tbody id="users-tbody" class="divide-y divide-slate-100 text-sm">
          </tbody>
        </table>
      </div>
    </section>

    <section id="page-about" class="page-content hidden space-y-6">
      <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-2xl font-bold mb-2">О нашем сервисе</h2>
        <p class="text-slate-600">Автор Арслан Турсбеков</p>
      </div>
    </section>

    <section id="page-empty" class="page-content hidden">
    </section>

  </main>

  <div id="auth-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm hidden">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 relative m-4">
      
      <button id="close-modal-btn" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold">
        &times;
      </button>

      <div class="flex border-b border-slate-200 mb-6">
        <button id="tab-login-btn" class="flex-1 py-2 font-semibold text-center border-b-2 border-indigo-600 text-indigo-600">
          Вход
        </button>
        <button id="tab-register-btn" class="flex-1 py-2 font-semibold text-center border-b-2 border-transparent text-slate-400 hover:text-slate-600">
          Регистрация
        </button>
      </div>

      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email</label>
          <input type="email" id="login-email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Пароль</label>
          <input type="password" id="login-password" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">
          Войти
        </button>
      </form>

      <form id="form-register" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Имя</label>
          <input type="text" id="reg-name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email</label>
          <input type="email" id="reg-email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Пароль</label>
          <input type="password" id="reg-password" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">
          Зарегистрироваться
        </button>
      </form>

    </div>
  </div>

  <footer class="bg-slate-800 text-slate-400 py-4 text-center text-sm border-t border-slate-700">
    <p>&copy; 2026 Arslan Tursbekov</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const modal = document.getElementById('auth-modal');
      const openModalBtn = document.getElementById('open-modal-btn');
      const closeModalBtn = document.getElementById('close-modal-btn');
      
      const loginForm = document.getElementById('form-login');
      const regForm = document.getElementById('form-register');
      const tabLoginBtn = document.getElementById('tab-login-btn');
      const tabRegisterBtn = document.getElementById('tab-register-btn');
      
      const navButtons = document.querySelectorAll('.nav-btn');

      function navigateTo(pageId) {
        document.querySelectorAll('.page-content').forEach(page => page.classList.add('hidden'));
        
        const targetPage = document.getElementById(`page-${pageId}`);
        if (targetPage) targetPage.classList.remove('hidden');

        if (pageId === 'users') {
          renderUsersTable();
        }
      }

      navButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          const pageId = e.currentTarget.getAttribute('data-page');
          navigateTo(pageId);
        });
      });

      const toggleModal = (show) => {
        modal.classList.toggle('hidden', !show);
      };

      openModalBtn.addEventListener('click', () => toggleModal(true));
      closeModalBtn.addEventListener('click', () => toggleModal(false));

      modal.addEventListener('click', (e) => {
        if (e.target === modal) toggleModal(false);
      });

      function switchTab(tab) {
        if (tab === 'login') {
          loginForm.classList.remove('hidden');
          regForm.classList.add('hidden');
          tabLoginBtn.className = "flex-1 py-2 font-semibold text-center border-b-2 border-indigo-600 text-indigo-600";
          tabRegisterBtn.className = "flex-1 py-2 font-semibold text-center border-b-2 border-transparent text-slate-400 hover:text-slate-600";
        } else {
          loginForm.classList.add('hidden');
          regForm.classList.remove('hidden');
          tabRegisterBtn.className = "flex-1 py-2 font-semibold text-center border-b-2 border-indigo-600 text-indigo-600";
          tabLoginBtn.className = "flex-1 py-2 font-semibold text-center border-b-2 border-transparent text-slate-400 hover:text-slate-600";
        }
      }

      tabLoginBtn.addEventListener('click', () => switchTab('login'));
      tabRegisterBtn.addEventListener('click', () => switchTab('register'));

      function getUsers() {
        return JSON.parse(localStorage.getItem('registered_users')) || [];
      }

      regForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;

        const users = getUsers();

        if (users.some(user => user.email === email)) {
          alert('Пользователь с таким Email уже существует!');
          return;
        }

        users.push({ id: Date.now(), name, email, password });
        localStorage.setItem('registered_users', JSON.stringify(users));

        alert('Регистрация прошла успешно!');
        regForm.reset();
        toggleModal(false);
        navigateTo('users');
      });

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        const users = getUsers();
        const user = users.find(u => u.email === email && u.password === password);

        if (user) {
          alert(`С возвращением, ${user.name}!`);
          loginForm.reset();
          toggleModal(false);
        } else {
          alert('Неверный Email или пароль!');
        }
      });

      function renderUsersTable() {
        const users = getUsers();
        const tbody = document.getElementById('users-tbody');

        if (users.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="3" class="p-4 text-center text-slate-400">Нет зарегистрированных пользователей</td>
            </tr>`;
          return;
        }

        tbody.innerHTML = users.map((user, index) => `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-4 text-slate-400 font-mono text-xs">${index + 1}</td>
            <td class="p-4 font-medium text-slate-800">${escapeHtml(user.name)}</td>
            <td class="p-4 text-slate-500">${escapeHtml(user.email)}</td>
          </tr>
        `).join('');
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    });
  </script>
</body>
</html>
