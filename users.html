<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: rgb(17, 21, 123);
            color: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
            background-color: rgb(18, 8, 68);
            border-bottom: 2px solid rgb(152, 169, 220);
        }

        .logo {
            font-size: 40px;
            font-weight: bold;
        }

        a {
            margin: 0 15px;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        table {
            width: 80%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 2px solid rgb(129, 154, 225);
            padding: 12px;
            text-align: center;
        }

        footer {
            position: sticky;
            bottom: 0;
            background-color: rgb(18, 8, 68);
            padding: 30px 50px;
            font-size: 24px;
            border-top: 2px solid rgb(129, 154, 225);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">JAKE</div>
        <nav>
            <a href="main.html">Home</a>
            <a href="register.html">Register</a>
            <a href="users.html">Users</a>
            <a href="empty.html">Empty</a>
        </nav>
    </header>

    <main>
        <h2>Registered People</h2>
        <table>
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                </tr>
            </thead>
            <tbody id="usertable"></tbody>
        </table>
    </main>

    <footer>
        <div>Mynda footer</div>
    </footer>

    <script>
        let fn = localStorage.getItem('fname');
        let ln = localStorage.getItem('lname');
        let em = localStorage.getItem('email');
        let num = localStorage.getItem('number');

        if (fn) {
            document.getElementById('usertable').innerHTML = `
                <tr>
                    <td>${fn}</td>
                    <td>${ln}</td>
                    <td>${em}</td>
                    <td>${num}</td>
                </tr>
            `;
        }
    </script>

</body>
</html>
