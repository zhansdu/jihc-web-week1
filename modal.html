<link rel="stylesheet" href="modal.css">
    <div id="contactModal" class="modal">
      <div class="modal-content">
        <span onclick="closeModal()">&times;</span>
        <h2>JOIN THE CABIN</h2>

        <form>
          <input type="text" placeholder="Pilot Name" class="usernameInput"/>
          <input type="email" placeholder="Space-Mail"  class="email"/>
          <textarea placeholder="Password..." class="password"></textarea>
          <button type="submit" onclick="submitForm()">Send Signal</button>
        </form>
      </div>
    </div>
