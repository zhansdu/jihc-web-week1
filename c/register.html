<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentHub - Register</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>StudentHub</h1>

      <div id="navbar"></div>
    </header>
    <div class="logcontainer">
      <div class="forms">
        <div class="formBox">
          <h2>Login</h2>

          <form id="loginForm">
            <input class="email" type="email" placeholder="Email" required />

            <input
              class="password"
              type="password"
              placeholder="Password"
              required
            />

            <button type="submit">Login</button>
            
          </form>

          <p class="loginMessage"></p>
        </div>
      </div>
    </div>
    <main class="container">
      <div class="forms">
        <div class="formBox">
          <h2>Registration Form</h2>

          <form id="registerForm">
            <input class="name" type="text" placeholder="Full name" required />

            <input class="email1" type="email" placeholder="Email" required />

            <input
              class="password1"
              type="password"
              placeholder="Password"
              required
            />

            <input class="age" type="number" placeholder="Age" required />

            <button type="submit">Register</button>
          </form>

          <p class="registerMessage"></p>
        </div>
      </div>
    </main>

    <footer>
    
    </footer>

    <script src="script.js"></script>
  </body>
</html>
